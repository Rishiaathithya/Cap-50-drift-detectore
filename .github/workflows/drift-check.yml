name: CAP-50 Drift Check
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call deployed drift service
        env:
          DRIFT_SERVICE_URL: ${{ secrets.DRIFT_SERVICE_URL }}
          DRIFT_API_TOKEN: ${{ secrets.DRIFT_API_TOKEN }}
        run: |
          test -n "$DRIFT_SERVICE_URL" || (echo "Set DRIFT_SERVICE_URL secret" && exit 1)
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $DRIFT_API_TOKEN"             "$DRIFT_SERVICE_URL/scan"
